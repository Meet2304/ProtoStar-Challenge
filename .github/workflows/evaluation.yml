name: Evaluation contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: python -m pip install -r code/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python code/evaluate.py check-submission
      - run: python tests/ci_suite_identity.py identity.txt
      - uses: actions/upload-artifact@v7
        with:
          name: identity-${{ matrix.os }}
          path: identity.txt
  portable-suite-identity:
    needs: offline-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: identity-*
          path: identities
      - name: Require the same logical suite on Windows and Linux
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('identities').glob('*/identity.txt'))
          assert len(files) == 2, files
          values = [file.read_text().strip() for file in files]
          assert len(set(values)) == 1, values
          print('Windows and Linux suite identity:', values[0])
          PY
