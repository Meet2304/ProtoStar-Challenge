[project]
name = "protostar-challenge"
version = "0.1.0"
description = "Reproducible climate-risk forecasting pipeline for the ProtoStar Challenge"
readme = "README.md"
authors = [
    { name = "Meet Bhatt", email = "meetbhatt2304@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
protostar-challenge = "protostar_challenge:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
